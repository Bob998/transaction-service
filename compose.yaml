services:
  app:
    image: ${APP_IMAGE:-transaction-service:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
    container_name: transaction-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-transaction_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-transaction_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-transaction_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_GATEWAY_BASE_URL: ${PAYMENT_GATEWAY_BASE_URL:-http://app:8080/mock-gateway}
      SERVER_PORT: 8080
      PERFORMANCE_LAB_ENABLED: ${PERFORMANCE_LAB_ENABLED:-true}
      HEALTH_SHOW_DETAILS: ${HEALTH_SHOW_DETAILS:-always}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-100}
      TOMCAT_MIN_SPARE_THREADS: ${TOMCAT_MIN_SPARE_THREADS:-10}
      TOMCAT_ACCEPT_COUNT: ${TOMCAT_ACCEPT_COUNT:-100}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-2000}
      PERF_WORKER_CORE_SIZE: ${PERF_WORKER_CORE_SIZE:-4}
      PERF_WORKER_MAX_SIZE: ${PERF_WORKER_MAX_SIZE:-8}
      PERF_WORKER_QUEUE_CAPACITY: ${PERF_WORKER_QUEUE_CAPACITY:-20}
      PERF_DATABASE_WORKERS: ${PERF_DATABASE_WORKERS:-20}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:NativeMemoryTracking=summary -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Xlog:gc*:file=/tmp/gc.log:time,uptime,level,tags:filecount=5,filesize=10M}
    mem_limit: ${APP_MEMORY_LIMIT:-768m}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8080/actuator/health/readiness
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6

  postgres:
    image: postgres:17
    container_name: transaction-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transaction_db}
      POSTGRES_USER: ${POSTGRES_USER:-transaction_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transaction_password}
    ports:
      - "5432:5432"
    volumes:
      - transaction_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-transaction_user} -d ${POSTGRES_DB:-transaction_db}
      interval: 5s
      timeout: 3s
      retries: 10

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: transaction-kafka-exporter
    command:
      - --kafka.server=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: transaction-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - transaction_prometheus_data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      app:
        condition: service_healthy
      kafka-exporter:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: transaction-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - transaction_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: transaction-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - transaction_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: transaction-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - transaction_kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list
      interval: 10s
      timeout: 5s
      retries: 10

  jmeter:
    image: justb4/jmeter:5.5
    platform: linux/amd64
    profiles: ["load-test"]
    container_name: transaction-jmeter
    environment:
      JVM_ARGS: -Xms256m -Xmx512m
    volumes:
      - ./load-test:/tests
    command:
      - -n
      - -f
      - -t
      - /tests/transaction-capacity.jmx
      - -JTARGET_HOST=app
      - -JTARGET_PORT=8080
      - -JTHREADS=${JMETER_THREADS:-10}
      - -JRAMP_SECONDS=${JMETER_RAMP_SECONDS:-10}
      - -JDURATION_SECONDS=${JMETER_DURATION_SECONDS:-60}
      - -l
      - /tests/results/results.jtl
      - -e
      - -o
      - /tests/results/report
    depends_on:
      app:
        condition: service_healthy

volumes:
  transaction_postgres_data:
  transaction_redis_data:
  transaction_kafka_data:
  transaction_prometheus_data:
  transaction_grafana_data:

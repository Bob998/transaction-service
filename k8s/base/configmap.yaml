apiVersion: v1
kind: ConfigMap
metadata:
  name: transaction-config
  namespace: transaction-system
data:
  POSTGRES_DB: transaction_db
  POSTGRES_USER: transaction_user
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transaction_db
  SPRING_DATASOURCE_USERNAME: transaction_user
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  PAYMENT_GATEWAY_BASE_URL: http://transaction-service:8080/mock-gateway
  SERVER_PORT: "8080"
  DEPLOYMENT_LAB_ENABLED: "true"
  PERFORMANCE_LAB_ENABLED: "false"
  HEALTH_SHOW_DETAILS: "always"
  TOMCAT_MAX_THREADS: "100"
  TOMCAT_MIN_SPARE_THREADS: "10"
  TOMCAT_ACCEPT_COUNT: "100"
  DB_POOL_MAX_SIZE: "20"
  DB_POOL_MIN_IDLE: "2"
  DB_CONNECTION_TIMEOUT_MS: "2000"
  RELEASE_TRACK: stable

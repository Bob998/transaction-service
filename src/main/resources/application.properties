spring.application.name=transaction-service
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/transaction_db
spring.datasource.username=transaction_user
spring.datasource.password=transaction_password
spring.datasource.driver-class-name=org.postgresql.Driver

# 第10周容量实验：连接池大小必须和数据库容量、请求并发一起评估。
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:2000}
spring.datasource.hikari.validation-timeout=1000

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true

# Redis（只用于临时计数、缓存与协调，不作为交易最终账本）
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s

# 用户请求限流：每个用户在60秒内最多10次
transaction.rate-limit.requests=10
transaction.rate-limit.window-ms=60000

# 通道每日额度的 Redis Key 保留两天，便于排查上一日数据
transaction.channel-quota.key-ttl-ms=172800000
transaction.channel-quota.daily-limit=1000000.00

# 用户风控滑动窗口：最近 60 秒最多 5 笔且累计不超过 1000 元
transaction.risk-window.duration-ms=60000
transaction.risk-window.max-transactions=5
transaction.risk-window.max-total-amount=1000.00

# 通道路由缓存 5 分钟；缓存失效或 Redis 故障时回源 PostgreSQL
transaction.route-cache.ttl-seconds=300

# 创建交易的幂等结果短期缓存 10 分钟，数据库唯一约束仍负责最终兜底
transaction.idempotency-cache.ttl-seconds=600

# Kafka连接地址
spring.kafka.bootstrap-servers=localhost:9092

# Producer序列化
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# 等待所有同步副本确认
spring.kafka.producer.acks=all

# Producer自动重试
spring.kafka.producer.retries=10

# 开启幂等Producer，避免重试造成重复写入Kafka分区
spring.kafka.producer.properties.enable.idempotence=true

# 限制同时未确认请求数，满足幂等Producer要求
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# 单次发送最长等待时间
spring.kafka.producer.properties.delivery.timeout.ms=120000

# 单个请求超时时间
spring.kafka.producer.properties.request.timeout.ms=30000

transaction.outbox.publish-delay-ms=1000

# Consumer Group
spring.kafka.consumer.group-id=transaction-processing-group

# Consumer从String反序列化
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# 禁止Consumer自动定时提交Offset
spring.kafka.consumer.enable-auto-commit=false

# 成功处理一条消息后提交该消息的Offset
spring.kafka.listener.ack-mode=record

# 没有历史Offset时从最早消息开始
spring.kafka.consumer.auto-offset-reset=earliest

# 同一个应用实例启动3个Consumer线程
spring.kafka.listener.concurrency=3

# 方便在Consumer Group中识别消费者
spring.kafka.consumer.client-id=transaction-consumer

# 对外开放健康检查和指标查询端点
management.endpoints.web.exposure.include=health,metrics,prometheus

# 默认不暴露组件详情；本地学习环境可通过环境变量显式开启。
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}

# Kubernetes/Docker可分别使用 /actuator/health/liveness 和 readiness
management.endpoint.health.probes.enabled=true

# 开启 Tomcat MBean 指标，暴露当前线程数和繁忙线程数。
server.tomcat.mbeanregistry.enabled=true

# Web线程数不是越大越好；过多线程会增加上下文切换并把压力传给下游。
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:100}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:10}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}

# 为请求和通道调用生成直方图，Prometheus 才能计算 P95/P99。
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.business.channel.request.duration=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s,5s
management.metrics.distribution.slo.business.channel.request.duration=50ms,100ms,250ms,500ms,1s,2s,5s

# 第9周故障实验：连续超时达到阈值后打开通道熔断器。
transaction.channel-circuit.failure-threshold=3
transaction.channel-circuit.open-duration=30s

# 内置学习用模拟通道。实际生产应替换成真实的独立支付通道地址。
payment.gateway.base-url=http://localhost:${server.port:8080}/mock-gateway

# 第10周受控性能实验。默认关闭，仅在本地Docker学习环境显式开启。
transaction.performance-lab.enabled=${PERFORMANCE_LAB_ENABLED:false}
transaction.performance-lab.worker.core-size=${PERF_WORKER_CORE_SIZE:4}
transaction.performance-lab.worker.max-size=${PERF_WORKER_MAX_SIZE:8}
transaction.performance-lab.worker.queue-capacity=${PERF_WORKER_QUEUE_CAPACITY:20}
transaction.performance-lab.database-workers=${PERF_DATABASE_WORKERS:20}
transaction.performance-lab.max-tasks=100
transaction.performance-lab.max-duration-ms=10000
transaction.performance-lab.max-retained-mb=128

# 第11周部署实验。生产环境默认关闭，Kubernetes学习环境显式开启。
transaction.deployment-lab.enabled=${DEPLOYMENT_LAB_ENABLED:false}
transaction.release.version=${APP_VERSION:local}
transaction.release.track=${RELEASE_TRACK:stable}
transaction.release.pod-name=${POD_NAME:local}

spring.application.name=transaction-service
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/transaction_db
spring.datasource.username=transaction_user
spring.datasource.password=transaction_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true

# Redis（只用于临时计数、缓存与协调，不作为交易最终账本）
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s

# 用户请求限流：每个用户在60秒内最多10次
transaction.rate-limit.requests=10
transaction.rate-limit.window-ms=60000

# 通道每日额度的 Redis Key 保留两天，便于排查上一日数据
transaction.channel-quota.key-ttl-ms=172800000
transaction.channel-quota.daily-limit=1000000.00

# 用户风控滑动窗口：最近 60 秒最多 5 笔且累计不超过 1000 元
transaction.risk-window.duration-ms=60000
transaction.risk-window.max-transactions=5
transaction.risk-window.max-total-amount=1000.00

# 通道路由缓存 5 分钟；缓存失效或 Redis 故障时回源 PostgreSQL
transaction.route-cache.ttl-seconds=300

# 创建交易的幂等结果短期缓存 10 分钟，数据库唯一约束仍负责最终兜底
transaction.idempotency-cache.ttl-seconds=600
